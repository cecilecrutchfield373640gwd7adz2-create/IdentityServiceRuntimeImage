            mkdir -p /tmp/code-analysis-step
            echo 'bucket-8 discover-sanity-tests' | sed 'p;d' | head -1 > /tmp/code-analysis-step/requiredProvisioning
            du -b /tmp/code-analysis-step/requiredProvisioning
